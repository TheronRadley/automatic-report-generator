name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.4"
      - run: ruff check src tests examples benchmarks
      - run: ruff format --check src tests examples benchmarks

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest
      - name: Coverage (primary leg)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pytest --cov=src/reportgen --cov-report=term --cov-report=xml
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reportgen
          POSTGRES_PASSWORD: reportgen-test-only
          POSTGRES_DB: reportgen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reportgen"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REPORTGEN_TEST_PG_URL: postgresql://reportgen:reportgen-test-only@localhost:5432/reportgen_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -m postgres -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Smoke-install the wheel into a clean venv
        run: |
          python -m venv /tmp/smokevenv
          /tmp/smokevenv/bin/pip install dist/*.whl
          /tmp/smokevenv/bin/reportgen --help
          /tmp/smokevenv/bin/reportgen version
          /tmp/smokevenv/bin/reportgen generate examples/configs/sales-report.yaml --all --overwrite
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[postgres]" pip-audit
      - run: pip-audit --skip-editable
